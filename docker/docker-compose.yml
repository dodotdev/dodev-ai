services:
  domcp:
    image: ghcr.io/dodotdev/domcp-ai:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: domcp
    restart: unless-stopped
    environment:
      - CONVEX_URL=${CONVEX_URL}
      - DOMCP_API_KEY=${DOMCP_API_KEY}
      - DOMCP_MODE=${DOMCP_MODE:-self-hosted}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    ports:
      - "3100:3100" # SSE endpoint (optional, for HTTP-based MCP clients)
    volumes:
      - domcp-data:/app/data

volumes:
  domcp-data:
