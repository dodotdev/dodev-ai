services:
  todomcp:
    image: ghcr.io/dodotdev/todomcp:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: todomcp
    restart: unless-stopped
    environment:
      - CONVEX_URL=${CONVEX_URL}
      - TODOMCP_API_KEY=${TODOMCP_API_KEY}
      - TODOMCP_MODE=${TODOMCP_MODE:-self-hosted}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    ports:
      - "3100:3100" # SSE endpoint (optional, for HTTP-based MCP clients)
    volumes:
      - todomcp-data:/app/data

volumes:
  todomcp-data:
