services:
  dodev:
    image: ghcr.io/dodotdev/dodev-ai:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: dodev
    restart: unless-stopped
    environment:
      - CONVEX_URL=${CONVEX_URL}
      - DODEV_API_KEY=${DODEV_API_KEY}
      - DODEV_MODE=${DODEV_MODE:-self-hosted}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    ports:
      - "3100:3100" # SSE endpoint (optional, for HTTP-based MCP clients)
    volumes:
      - dodev-data:/app/data

volumes:
  dodev-data:
